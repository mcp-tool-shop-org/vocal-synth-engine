app = "vocal-synth-cockpit"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  RENDER_STORE_DIR = "/data/renders"
  PRESET_DIR = "/app/presets"
  APP_VERSION = "1.0.3"

[http_service]
  internal_port = 4321
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

# Edge-level health probe. /api/health returns {ok, version, uptimeSec}
# (S-018 split — full details live behind requireAuth at /api/health/detailed).
# grace_period covers cold-start latency from auto_stop_machines = "stop".
[[http_service.checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"

[[mounts]]
  source = "render_bank"
  destination = "/data/renders"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
