version: 2
updates:
  # Root npm package — weekly per CB-014 (express 5 / ws 8 / zod 4 are
  # on active release cycles; monthly was too sleepy for non-security
  # advisories — security advisories use the out-of-band Dependabot
  # security-updates channel enabled via repo settings).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-deps:
        patterns:
          - "*"

  # Cockpit UI (separate package.json + lockfile)
  - package-ecosystem: "npm"
    directory: "/apps/cockpit"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      cockpit-deps:
        patterns:
          - "*"

  # Site (Astro/Starlight, separate package.json + lockfile)
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      site-deps:
        patterns:
          - "*"

  # GitHub Actions workflows — slower-moving surface, monthly cadence.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"

  # Docker base image (Dockerfile) — node:20-slim minor bumps, monthly.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(docker)"
