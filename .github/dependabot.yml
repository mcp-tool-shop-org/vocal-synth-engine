version: 2
updates:
  # Root npm package
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      npm-deps:
        patterns:
          - "*"

  # Cockpit UI (separate package.json + lockfile)
  - package-ecosystem: "npm"
    directory: "/apps/cockpit"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      cockpit-deps:
        patterns:
          - "*"

  # Site (Astro/Starlight, separate package.json + lockfile)
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      site-deps:
        patterns:
          - "*"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  # Docker base image (Dockerfile)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
