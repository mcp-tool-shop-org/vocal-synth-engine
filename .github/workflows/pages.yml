name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  # The site is built on pull requests too, not only on the push that
  # deploys it. Without this, nothing in the PR-triggered set builds the
  # site, so a breaking site change cannot fail a PR -- only a deployment,
  # after main already has it. That is how audiobooker and comfy-headless
  # both went red on 2026-09-17 when Dependabot bumped @astrojs/starlight
  # to 0.42.1: Starlight 0.39 removed autogenerated sidebar groups carrying
  # a `label`, and site/astro.config.mjs still used that shape.
  #
  # This repo still declares Starlight <0.39, so its config is correct for
  # the version it pins -- the point of this gate is that the bump PR, when
  # it arrives, fails here and gets fixed in the same PR instead of landing
  # on main and taking the deploy down.
  #
  # Paths-gated, unlike ci.yml's PR trigger: this workflow is not a required
  # check, so a filter cannot strand a PR behind a check that never reports.
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Building needs no write scope, so a PR-triggered run never
    # carries pages:write or id-token:write. Only deploy asks.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        # A PR run is a build check, not a deployment.
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # main is the only source of the published site. A PR proves the
    # build, it never publishes.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
