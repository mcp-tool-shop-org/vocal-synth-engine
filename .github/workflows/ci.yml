name: CI

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'lib/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'lib/**'
      - 'tests/**'
      - '.github/workflows/**'
  schedule:
    # Weekly Monday 06:00 UTC scheduled audit catches new advisories on
    # dormant branches. Severity threshold documented in SECURITY.md.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Intentionally guarded with --if-present. No lint config exists
        # (no ESLint / Prettier). tsconfig `strict: true` provides the
        # type-level guarantees we rely on. If a `lint` script is added
        # to package.json, this step auto-engages. See SHIP_GATE.md Notes.
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build:server

      - name: Security audit
        # Fail on high/critical only — moderate/low don't block release.
        # Threshold documented in SECURITY.md.
        run: npm audit --audit-level=high --omit=dev
