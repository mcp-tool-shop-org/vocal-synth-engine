name: CI

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'lib/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'lib/**'
      - 'tests/**'
      - '.github/workflows/**'
  schedule:
    # Weekly Monday 06:00 UTC scheduled audit catches new advisories on
    # dormant branches. Severity threshold documented in SECURITY.md.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    # Multi-OS x multi-Node matrix per CB-007. Per memory ratchet from
    # ollama-intern-mcp v2.5.0 → v2.5.3 (three orthogonal failure classes
    # on first multi-OS run), we set:
    #   - shell: bash on all jobs (Windows defaults to PowerShell otherwise)
    #   - NO_COLOR + FORCE_COLOR off so vitest output is greppable
    #   - || true on any pipe-into-grep would go here (none currently)
    # If win/mac jobs go consistently red on a known issue, flip
    # continue-on-error: true with a dated comment rather than hiding it.
    name: test (${{ matrix.os }} / node-${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]
    env:
      NO_COLOR: '1'
      FORCE_COLOR: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Intentionally guarded with --if-present. No lint config exists
        # (no ESLint / Prettier). tsconfig `strict: true` provides the
        # type-level guarantees we rely on. If a `lint` script is added
        # to package.json, this step auto-engages. See SHIP_GATE.md Notes.
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build:server

      - name: Security audit
        # Fail on high/critical only — moderate/low don't block release.
        # Threshold documented in SECURITY.md. Linux-only (npm audit
        # network calls don't differ by OS; one run saves CI minutes).
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 20
        run: npm audit --audit-level=high --omit=dev

  # ── Cockpit browser smoke tests (FTC-002) ──
  # Playwright tests live at apps/cockpit/tests/. They spin up the Vite
  # dev server via playwright.config.ts's webServer block, then load
  # index.html in chromium. Single OS / single Node — the cockpit ships
  # vanilla DOM + Web Audio so cross-browser drift isn't load-bearing,
  # and we want CI cost low.
  cockpit-tests:
    name: cockpit-tests (ubuntu-latest / node-20)
    runs-on: ubuntu-latest
    needs: lint-and-test
    env:
      NO_COLOR: '1'
      FORCE_COLOR: '0'
      CI: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install cockpit dependencies
        run: npm --prefix apps/cockpit ci || npm --prefix apps/cockpit install

      - name: Install Playwright browsers (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run cockpit smoke tests
        run: npm run test:cockpit

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── Perf regression bench gate (FTC-004) ──
  # Linux-only; perf variance on shared runners is high enough that
  # cross-OS bench comparison is noise. Uses tests/__bench__/baseline.json
  # via scripts/bench-gate.mjs. Threshold is 2x — see scripts/bench-gate.mjs
  # for rationale.
  bench-gate:
    name: bench-gate (ubuntu-latest / node-20)
    runs-on: ubuntu-latest
    needs: lint-and-test
    env:
      NO_COLOR: '1'
      FORCE_COLOR: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run benches
        run: npm run bench

      - name: Compare against baseline (fail on > 2x regression)
        run: npm run bench:gate

      - name: Upload bench artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results
          path: tests/__bench__/last-run.json
          retention-days: 14
