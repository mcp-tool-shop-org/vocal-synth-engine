services:
  - type: web
    name: vocal-synth-cockpit
    runtime: docker
    region: ohio
    plan: starter
    # Render uses this for zero-downtime deploys and to flap unhealthy
    # instances out of the pool. /api/health is the public probe (S-018:
    # public shape {ok, version, uptimeSec}; detailed payload lives behind
    # requireAuth at /api/health/detailed).
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER_STORE_DIR
        value: /data/renders
      - key: PRESET_DIR
        value: /app/presets
      - key: APP_VERSION
        value: "1.0.3"
      - key: AUTH_TOKEN
        sync: false
      - key: PORT
        value: "4321"
    disk:
      name: render-bank
      mountPath: /data/renders
      sizeGB: 1
